<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IMHS">
<meta name="format-detection" content="telephone=no">
<title>IMHS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // テーマのちらつき防止（設定は端末内）
  try { var s = JSON.parse(localStorage.getItem('imhs:settings:v1') || '{}');
    if (['light','dark','ehon'].indexOf(s.theme) >= 0) document.documentElement.dataset.theme = s.theme; } catch (e) {}
</script>
<link rel="stylesheet" href="launcher.css">
<script type="module" src="launcher.js"></script>
</head>
<body>
<div class="shell">
  <span class="vine tl" aria-hidden="true"></span><span class="vine tr" aria-hidden="true"></span>
  <span class="vine bl" aria-hidden="true"></span><span class="vine br" aria-hidden="true"></span>
  <header class="head">
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 26C6 14 13 6 27 5c0 13-8 21-20 21z" fill="currentColor" opacity=".9"/><path d="M5 27c5-6 10-11 17-16" stroke="var(--bg)" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M4 18c0-6 3-10 9-11-1 5-3 8-9 11z" fill="currentColor" opacity=".55"/></svg><span>IMHS</span></div>
    <button class="gear" id="btn-settings" type="button" aria-label="設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
    </button>
  </header>
  <h1 class="section-title">マイゲーム</h1>
  <div class="update" id="update" hidden>
    <span>新しい版を準備しました。</span>
    <button class="btn small" id="btn-update" type="button">更新する</button>
  </div>
  <main class="games" id="games" aria-live="polite"></main>
  <div class="pager" id="pager" aria-label="ゲームの切り替え" hidden></div>
  <p class="offline" id="offline" role="status"><span class="dot"></span><span id="offline-text">確認中…</span></p>
</div>

<div class="modal" id="modal" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="panel-head">
      <h2 id="settings-title">設定</h2>
      <button class="close" id="btn-close" type="button" aria-label="閉じる">✕</button>
    </div>
    <section>
      <h3>ランチャーテーマ</h3>
      <div class="themes" id="themes" role="radiogroup" aria-label="ランチャーテーマ"></div>
      <p class="note">設定からいつでも変更できます（この端末に保存）。ゲーム画面は各ゲームの絵柄で表示されます。</p>
    </section>
    <section>
      <h3>バックアップと復元</h3>
      <div id="backups"></div>
      <p class="note">WindowsとiPhoneの間は、このJSONファイルで手動で移せます（自動同期はありません）。</p>
    </section>
    <section>
      <h3>オフライン</h3>
      <p class="note" id="offline-detail"></p>
      <div class="row"><button class="btn ghost small" id="btn-repair" type="button">オフライン用データを再取得</button></div>
    </section>
    <p class="ver" id="ver"></p>
  </div>
</div>
<div class="modal" id="confirm" hidden>
  <div class="panel small" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <h2 id="confirm-title"></h2>
    <div id="confirm-body"></div>
    <div class="row end" id="confirm-actions"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<noscript><p style="padding:2rem">JavaScript を有効にしてください。</p></noscript>
</body>
</html>
