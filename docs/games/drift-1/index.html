<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b2118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IMHS">
<meta name="format-detection" content="telephone=no">
<title>漂流発明記 ― 霧の島 ― - IMHS</title>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="stylesheet" href="game.css">
<script type="module" src="main.js"></script>
</head>
<body>
<canvas id="view" aria-label="霧の島"></canvas>
<div class="joy" id="joy" hidden><span class="knob" id="knob"></span></div>

<div class="hud" id="hud" aria-busy="true">
  <header class="top">
    <a class="iconbtn" id="btn-back" href="../../index.html" aria-label="ランチャーへ戻る">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5m6-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="quest" id="quest" role="status">
      <span class="era" id="era"></span>
      <b id="quest-text"></b>
      <span class="quest-need" id="quest-need"></span>
    </div>
    <button class="iconbtn" id="btn-settings" type="button" aria-label="設定・一時停止">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
    </button>
  </header>
  <div class="side">
    <button class="mini" id="btn-map" type="button" aria-label="島の地図"><canvas id="mini" width="180" height="180"></canvas></button>
    <button class="bag" id="btn-bag" type="button" aria-label="持ち物">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 4a3 3 0 0 1 6 0v1h3a2 2 0 0 1 2 2l-1 12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 7a2 2 0 0 1 2-2h3zm2 0v1h2V4a1 1 0 0 0-2 0z"/></svg>
      <b id="bag-num">0/12</b>
    </button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="bottom">
    <div class="card" id="card" hidden></div>
    <div class="modebar" id="modebar" hidden></div>
    <div class="bar" id="bar">
      <button class="btn big" id="btn-build" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22 19.6 12.4 10c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3l4.5 4.5-3.1 3.1L.3 4.9C-.9 7.3-.4 10.3 1.6 12.3c1.9 1.9 4.6 2.4 6.9 1.5l9.6 9.6c.4.4 1 .4 1.4 0l2.4-2.4c.5-.4.5-1.1.1-1.4z"/></svg>
        建てる
      </button>
    </div>
  </div>
</div>

<div class="banner" id="save-banner" role="alert" hidden></div>
<div class="sheet" id="sheet" hidden><div class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true"></div></div>
<div class="modal" id="modal" hidden><div class="panel" id="modal-panel" role="dialog" aria-modal="true"></div></div>
<div class="talk" id="talk" hidden>
  <div class="talk-box" role="dialog" aria-label="お話">
    <img class="talk-img" id="talk-img" alt="" hidden>
    <div class="talk-head"><strong id="talk-title"></strong><span id="talk-count"></span></div>
    <p id="talk-text"></p>
    <div class="talk-actions">
      <button type="button" class="btn ghost small" id="talk-skip">スキップ</button>
      <button type="button" class="btn small" id="talk-next">つぎへ ▶</button>
    </div>
  </div>
</div>
<div class="title" id="title" hidden></div>
<div class="scene" id="scene" hidden></div>
<noscript><p style="padding:2rem">JavaScript を有効にしてください。</p></noscript>
</body>
</html>
