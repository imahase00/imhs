<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eadfba">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IMHS">
<meta name="format-detection" content="telephone=no">
<title>ひだまり菜園 - IMHS</title>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="stylesheet" href="game.css">
<script type="module" src="main.js"></script>
</head>
<body>
<div class="app" id="app" aria-busy="true">
  <header class="topbar">
    <a class="iconbtn" id="btn-back" href="../../index.html" aria-label="ランチャーへ戻る">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5m6-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1 class="title">ひだまり菜園</h1>
    <button class="iconbtn" id="btn-settings" type="button" aria-label="設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <main class="layout">
    <section class="scene" id="scene" aria-label="菜園の風景">
      <img class="scene-img" src="img/bg/day.webp" alt="" decoding="async">
      <img class="scene-img fest-img" src="img/bg/festival.webp" alt="" decoding="async" loading="lazy">
      <div class="season-fx" aria-hidden="true"></div>
      <div class="scene-top">
        <span class="pill date-pill" id="date"></span>
        <span class="pill coin-pill" id="coins" aria-label="所持コイン"><i class="coin" aria-hidden="true"></i><b id="coin-num">0</b></span>
      </div>
      <div class="decor-row" id="decor-row" aria-label="庭の飾り"></div>
      <div class="featured" id="featured"></div>
    </section>

    <section class="cards" id="cards" aria-label="依頼と注文"></section>

    <section class="garden" aria-label="畑">
      <div class="hint" id="hint" role="status" hidden></div>
      <div class="plots" id="plots"></div>
    </section>

    <section class="seedbar" aria-label="まく種">
      <div class="seeds" id="seeds" role="radiogroup" aria-label="まく種"></div>
    </section>

    <section class="actions-row">
      <button type="button" class="btn ghost" id="btn-water-all" hidden>💧 まとめて水やり</button>
      <button type="button" class="btn ghost" id="btn-harvest-all" hidden>🧺 まとめて収穫</button>
      <button type="button" class="btn sleep" id="btn-sleep">🌙 おやすみ</button>
    </section>

    <nav class="navbar" aria-label="メニュー">
      <button type="button" class="navbtn" id="btn-basket"><span class="ico" aria-hidden="true">🧺</span><span>かご</span><small id="basket-count"></small></button>
      <button type="button" class="navbtn" id="btn-workshop"><span class="ico" aria-hidden="true">🍳</span><span>作業小屋</span><small id="workshop-badge"></small></button>
      <button type="button" class="navbtn" id="btn-shop"><span class="ico" aria-hidden="true">🏡</span><span>お店</span><small id="shop-badge"></small></button>
    </nav>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="banner" id="save-banner" role="alert" hidden></div>
<div class="modal" id="modal" hidden><div class="panel" id="modal-panel" role="dialog" aria-modal="true"></div></div>
<div class="night" id="night" hidden aria-hidden="true"><span id="night-text"></span></div>
<div class="talk" id="talk" hidden>
  <div class="talk-box" role="dialog" aria-label="会話">
    <img class="talk-face" id="talk-face" alt="" hidden>
    <div class="talk-body">
      <div class="talk-head"><strong id="talk-who"></strong><span id="talk-title"></span></div>
      <p id="talk-text"></p>
      <div class="talk-actions">
        <button type="button" class="btn ghost small" id="talk-skip">スキップ</button>
        <button type="button" class="btn small" id="talk-next">つぎへ ▶</button>
      </div>
    </div>
  </div>
</div>
<noscript><p style="padding:2rem">JavaScript を有効にしてください。</p></noscript>
</body>
</html>
