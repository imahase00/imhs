<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9dcb8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IMHS">
<meta name="format-detection" content="telephone=no">
<title>マージの旅 - IMHS</title>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="stylesheet" href="game.css">
<script type="module" src="main.js"></script>
</head>
<body>
<div class="app" id="app" aria-busy="true">
  <header class="topbar">
    <a class="iconbtn" id="btn-back" href="../../index.html" aria-label="ランチャーへ戻る">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5m6-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1 class="title"><span class="sprig" aria-hidden="true"></span>マージの旅<span class="sprig r" aria-hidden="true"></span></h1>
    <button class="iconbtn" id="btn-settings" type="button" aria-label="設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <main class="layout">
    <section class="scene" id="scene" aria-label="島の風景">
      <div class="stage" id="stage">
        <img class="scene-img" id="scene-img" alt="" decoding="async">
        <div class="lighthouse-glow" aria-hidden="true"><span class="beam"></span></div>
      </div>
      <div class="scene-top">
        <span class="pill island-pill" id="island-name">こもれび島</span>
        <span class="pill coin-pill" id="coins" aria-label="所持コイン"><i class="coin" aria-hidden="true"></i><b id="coin-num">0</b></span>
      </div>
      <div class="scene-bottom">
        <div class="landmarks" id="landmarks"></div>
        <div class="progress" id="progress" aria-label="依頼の進み具合"></div>
      </div>
    </section>

    <section class="cards" id="cards" aria-label="依頼と注文"></section>

    <section class="play" aria-label="盤面">
      <div class="hint" id="hint" role="status" hidden></div>
      <div class="board-wrap" id="board-wrap">
        <div class="board" id="board" role="grid" aria-label="盤面 横7×縦8"></div>
      </div>
    </section>

    <section class="dock">
      <div class="info" id="info" aria-live="polite"></div>
      <div class="gens-box">
        <div class="gens-label"><span>生産元</span></div>
        <div class="gens" id="gens"></div>
      </div>
    </section>

    <nav class="navbar" aria-label="メニュー">
      <button type="button" class="navbtn" id="btn-storage" data-drop="storage">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 11h24v15H4z" fill="#e8c48a" stroke="#7a5230" stroke-width="1.8"/><path d="M3 7h26v5H3z" fill="#d6a86a" stroke="#7a5230" stroke-width="1.8"/><path d="M8 16h16M8 21h16" stroke="#a87a48" stroke-width="1.5"/></svg>
        <span>収納</span><small id="storage-count"></small>
      </button>
      <button type="button" class="navbtn" id="btn-codex">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 8c5-2 9-1 13 2v17c-4-3-8-4-13-2z" fill="#f6ecd2" stroke="#8a3d2e" stroke-width="1.8"/><path d="M29 8c-5-2-9-1-13 2v17c4-3 8-4 13-2z" fill="#fbf4e2" stroke="#8a3d2e" stroke-width="1.8"/><path d="M7 13h5M7 17h5M20 13h5M20 17h5" stroke="#b9a07a" stroke-width="1.4"/><path d="M22 6c2 0 3 2 2 4-2 0-3-2-2-4z" fill="#6f9a3e"/></svg>
        <span>図鑑</span><small id="codex-count"></small>
      </button>
      <button type="button" class="navbtn" id="btn-map">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 8l8-3 10 3 8-3v19l-8 3-10-3-8 3z" fill="#bfe0d8" stroke="#5d6f4a" stroke-width="1.8"/><path d="M11 5v19M21 8v19" stroke="#5d6f4a" stroke-width="1.2"/><path d="M8 18c2-5 6-6 8-3s6 2 8-3" fill="none" stroke="#c0462f" stroke-width="1.6" stroke-dasharray="2 2"/><path d="M14 9l3 5h-6z" fill="#7ea153"/></svg>
        <span>島マップ</span><small id="map-badge"></small>
      </button>
    </nav>
  </main>
</div>

<!-- 収納シート -->
<section class="sheet" id="storage-sheet" hidden aria-label="収納">
  <div class="sheet-head">
    <strong>収納 <span id="storage-num"></span></strong>
    <button type="button" class="btn small" id="btn-expand"></button>
    <button type="button" class="iconbtn small" id="btn-storage-close" aria-label="収納を閉じる">✕</button>
  </div>
  <div class="storage-grid" id="storage-grid"></div>
  <p class="sheet-note">盤面の品物をここへドラッグ、または選んで「しまう」。収納の品物も納品に数えられます。</p>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="banner" id="save-banner" role="alert" hidden></div>
<div class="modal" id="modal" hidden><div class="panel" id="modal-panel" role="dialog" aria-modal="true"></div></div>
<div class="talk" id="talk" hidden>
  <div class="talk-box" role="dialog" aria-label="会話">
    <div class="talk-head"><strong id="talk-who"></strong><span id="talk-title"></span></div>
    <p id="talk-text"></p>
    <div class="talk-actions">
      <button type="button" class="btn ghost small" id="talk-log">記録</button>
      <button type="button" class="btn ghost small" id="talk-skip">スキップ</button>
      <button type="button" class="btn small" id="talk-next">つぎへ ▶</button>
    </div>
  </div>
</div>
<img class="drag-ghost" id="ghost" alt="" hidden>
<noscript><p style="padding:2rem">JavaScript を有効にしてください。</p></noscript>
</body>
</html>
